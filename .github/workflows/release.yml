name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "PyInstaller>=6.10,<7"

      - name: Build standalone executable
        run: |
          New-Item -ItemType Directory -Force -Path dist, build\pyinstaller | Out-Null
          python -m PyInstaller --noconfirm --clean --onefile --console --name LoLMonitor --distpath dist --workpath build\pyinstaller --specpath build\pyinstaller main.py
        shell: pwsh

      - name: Assemble portable archive
        run: |
          Copy-Item README.md dist\README.md
          Copy-Item LICENSE dist\LICENSE
          Compress-Archive -Path dist\LoLMonitor.exe, dist\README.md, dist\LICENSE -DestinationPath dist\LoLMonitor-windows-x64.zip -Force
        shell: pwsh

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LoLMonitor-windows-x64.zip
          generate_release_notes: true
